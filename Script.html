
<script>
  /* =========================================================
   * Script.html
   * ========================================================= */
  /* =========================================================
   * 1) GLOBAL VARIABLES - Script.html
   * ========================================================= */
  let userAvatarUrl = null;         // User avatar URL after login
  window.currentUser = null;        // Current user's username
  window.sessionToken = null;       // Session token from server
  window.currentUserRole = null;    // Current user's role (e.g., admin, user)
  window.existingContactsData = []; // Array holding existing contacts from server
  
  /* =========================================================
   * 2) DOM CONTENT LOADED EVENT & INITIAL SETUP
   * ========================================================= */
  document.addEventListener('DOMContentLoaded', function() {
    // --- General Event Listeners ---
    const closeAddCustomerModalBtn = document.getElementById('closeAddCustomerModalBtn');
    if (closeAddCustomerModalBtn) {
      closeAddCustomerModalBtn.addEventListener('click', function() {
        const successModal = document.getElementById('addCustomerSuccessModal');
        if (successModal) successModal.style.display = 'none';
      });
    }
  
    // --- Reporting Section Buttons ---
    const viewReportBtn = document.getElementById('viewReportBtn');
    if (viewReportBtn) {
      viewReportBtn.addEventListener('click', viewFilteredData);
    }
    const downloadReportBtn = document.getElementById('downloadReportBtn');
    if (downloadReportBtn) {
      downloadReportBtn.addEventListener('click', downloadFilteredData);
    }
  
    // --- Change Password Modal Handlers ---
    const changePassBtn = document.getElementById('changePasswordButton');
    if (changePassBtn) {
      changePassBtn.addEventListener('click', function() {
        const changeModal = document.getElementById('changePasswordModal');
        if (changeModal) changeModal.style.display = 'flex';
      });
    }
    document.getElementById('saveNewPasswordButton').addEventListener('click', saveNewPassword);
    document.getElementById('cancelChangePasswordButton').addEventListener('click', function() {
      closeModal('changePasswordModal');
      clearPasswordFields();
    });
  
    // --- Customer/Contacts/Workload Setup ---
    const addCustomerBtn = document.getElementById('addCustomerButton');
    if (addCustomerBtn) addCustomerBtn.addEventListener('click', toggleAddCustomerForm);
    const saveCustomerBtn = document.getElementById('saveNewCustomerButton');
    if (saveCustomerBtn) saveCustomerBtn.addEventListener('click', submitAddCustomerForm);
    const cancelAddCustomerBtn = document.getElementById('cancelAddCustomerButton');
    if (cancelAddCustomerBtn) cancelAddCustomerBtn.addEventListener('click', resetAddCustomerForm);
  
    // Manual contact person events
    const addContactPersonBtn = document.getElementById('addContactPersonBtn');
    if (addContactPersonBtn) addContactPersonBtn.addEventListener('click', () => addContactPerson());
    const manualContactsContainer = document.getElementById('manualContactsContainer');
    if (manualContactsContainer) {
      manualContactsContainer.addEventListener('click', function(event) {
        if (event.target && event.target.classList.contains('remove-contact')) {
          removeContactPerson(event.target);
        }
      });
    }
  
    // Workload item events
    const addWorkloadBtn = document.getElementById('addWorkloadBtn');
    if (addWorkloadBtn) addWorkloadBtn.addEventListener('click', addWorkloadItem);
    const workloadContainer = document.getElementById('workloadContainer');
    if (workloadContainer) {
      workloadContainer.addEventListener('click', function(e) {
        if (e.target && e.target.classList.contains('remove-workload')) {
          removeWorkloadItem(e.target);
        }
      });
    }
  
    // Modal response buttons
    const yesAddMoreBtn = document.getElementById('yesAddMoreBtn');
    if (yesAddMoreBtn) yesAddMoreBtn.addEventListener('click', () => handleModalResponse(true));
    const noAddMoreBtn = document.getElementById('noAddMoreBtn');
    if (noAddMoreBtn) noAddMoreBtn.addEventListener('click', () => handleModalResponse(false));
  
    // Error modal close
    const closeErrorModalBtn = document.getElementById('closeErrorModalBtn');
    if (closeErrorModalBtn) closeErrorModalBtn.addEventListener('click', closeErrorModal);
  
    // --- Login & Forgot Password Setup ---
    const loginBtn = document.getElementById('loginButton');
    if (loginBtn) loginBtn.addEventListener('click', login);
    const forgotLink = document.getElementById('forgotPasswordLink');
    const forgotPasswordModal = document.getElementById('forgotPasswordModal');
    const resetButton = document.getElementById('resetPasswordButton');
    const cancelButton = document.getElementById('cancelResetButton');
    if (forgotLink) {
      forgotLink.addEventListener('click', function(e) {
        e.preventDefault();
        if (forgotPasswordModal) forgotPasswordModal.style.display = 'flex';
      });
    }
    if (resetButton) {
      resetButton.addEventListener('click', resetForgotPassword);
    }
    if (cancelButton) {
      cancelButton.addEventListener('click', function() {
        if (forgotPasswordModal) forgotPasswordModal.style.display = 'none';
      });
    }
  
    // --- Export Button ---
    const exportBtn = document.getElementById('exportDataButton');
    if (exportBtn) exportBtn.addEventListener('click', exportSalesData);
  
    // --- Change Customer ---
    const changeCustomerBtn = document.getElementById('changeCustomerBtn');
    if (changeCustomerBtn) {
      changeCustomerBtn.addEventListener('click', function() {
        const customerSelect = document.getElementById('Customer');
        if (customerSelect) customerSelect.disabled = false;
        customerSelect.value = ""; // Clear the selected value so user can choose again.
        changeCustomerBtn.style.display = 'none';
        const selectedCustomerLabel = document.getElementById('selectedCustomerLabel');
        if (selectedCustomerLabel) {
          selectedCustomerLabel.style.display = 'none';
          selectedCustomerLabel.textContent = '';
        }
        resetContactsSection();
      });
    }
  
    // --- Toggle Existing Contacts ---
    const toggleExistingContactsBtn = document.getElementById('toggleExistingContactsBtn');
    const existingContactsCollapsible = document.getElementById('existingContactsCollapsible');
    if (toggleExistingContactsBtn && existingContactsCollapsible) {
      toggleExistingContactsBtn.addEventListener('click', function() {
        if (existingContactsCollapsible.classList.contains('expanded')) {
          existingContactsCollapsible.classList.remove('expanded');
          existingContactsCollapsible.classList.add('collapsed');
          toggleExistingContactsBtn.textContent = 'Show Existing Contacts';
        } else {
          existingContactsCollapsible.classList.remove('collapsed');
          existingContactsCollapsible.classList.add('expanded');
          toggleExistingContactsBtn.textContent = 'Hide Existing Contacts';
        }
      });
    }
  
    // --- (Additional setup as needed) ---
  });
  
  /* =========================================================
   * 3) LOGIN FUNCTIONALITY
   * ========================================================= */
  function login() {
    const loginSpinner = document.getElementById('loginSpinner');
    if (loginSpinner) loginSpinner.style.display = 'inline-block';
  
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
  
    if (!username || !password) {
      showCustomError('Please enter both username and password.');
      if (loginSpinner) loginSpinner.style.display = 'none';
      return;
    }
  
    google.script.run
      .withSuccessHandler(function(response) {
        if (loginSpinner) loginSpinner.style.display = 'none';
        if (response.success) {
          document.getElementById('loginForm').style.display = 'none';
          document.getElementById('mainForm').style.display = 'block';
  
          populateDropdowns();
          document.getElementById('welcomeContainer').style.display = 'block';
  
          const welcomeMsg = document.getElementById('welcomeMessage');
          if (welcomeMsg) {
            welcomeMsg.innerHTML = `Welcome, <span style="color:#0072C6">${response.username}</span> (<strong>${response.role}</strong>) - For Sales Report Form`;
          }
  
          if (response.avatarUrl) {
            const avatarImg = document.getElementById('salesPersonAvatar');
            if (avatarImg) {
              avatarImg.src = response.avatarUrl.trim();
              avatarImg.style.display = 'inline';
            }
          }
  
          window.currentUser = response.username;
          window.sessionToken = response.token;
          window.currentUserRole = response.role;
          
          const reportingSection = document.getElementById('reportingSection');
          if (reportingSection) reportingSection.style.display = 'block';
        } else {
          const loginError = document.getElementById('loginError');
          if (loginError) loginError.style.display = 'block';
        }
      })
      .withFailureHandler(function(error) {
        console.error("Error during login:", error);
        if (loginSpinner) loginSpinner.style.display = 'none';
        showCustomError('An unexpected error occurred. Please try again.');
      })
      .checkLogin(username, password);
  }
  
  /* =========================================================
   * 4) EXISTING CONTACTS MANAGEMENT
   * ========================================================= */
  function populateExistingContacts(customerId) {
    google.script.run
      .withSuccessHandler(function(contacts) {
        const existingContactsContainer = document.getElementById('existingContactsContainer');
        if (!existingContactsContainer) return;
        existingContactsContainer.innerHTML = '';
  
        const customerSelect = document.getElementById('Customer');
        if (customerSelect) customerSelect.disabled = true;
  
        const selectedCustomerLabel = document.getElementById('selectedCustomerLabel');
        if (selectedCustomerLabel) {
          selectedCustomerLabel.textContent = `Selected Customer: ${customerId}`;
          selectedCustomerLabel.style.display = 'block';
        }
  
        const changeCustomerBtn = document.getElementById('changeCustomerBtn');
        if (changeCustomerBtn) changeCustomerBtn.style.display = 'inline-block';
  
        if (contacts.length > 0) {
          const heading = document.createElement('h4');
          heading.textContent = 'Existing Contact Persons:';
          existingContactsContainer.appendChild(heading);
  
          contacts.forEach((contact, index) => {
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.id = `existingContact_${index}`;
            checkbox.value = index;
            checkbox.classList.add('existing-contact-checkbox');
  
            const label = document.createElement('label');
            label.htmlFor = `existingContact_${index}`;
            label.textContent = `${contact.name} (${contact.post}) - ${contact.number}`;
  
            const wrapper = document.createElement('div');
            wrapper.classList.add('existing-contact');
            wrapper.appendChild(checkbox);
            wrapper.appendChild(label);
  
            existingContactsContainer.appendChild(wrapper);
          });
  
          const addSelectedBtn = document.createElement('button');
          addSelectedBtn.type = 'button';
          addSelectedBtn.id = 'addSelectedContactsBtn';
          addSelectedBtn.classList.add('btn', 'btn-secondary', 'add-button');
          addSelectedBtn.textContent = 'Add Selected Contacts';
          addSelectedBtn.addEventListener('click', addSelectedContacts);
          existingContactsContainer.appendChild(addSelectedBtn);
        } else {
          const message = document.createElement('p');
          message.className = 'no-contacts-message';
          message.textContent = 'No existing contacts found. Please add contacts manually.';
          existingContactsContainer.appendChild(message);
        }
      })
      .withFailureHandler(function(error) {
        console.error('Failed to load existing contacts:', error);
        showCustomError('Failed to load existing contacts. Please try again.');
      })
      .getExistingContacts(customerId);
  }
  
  function addSelectedContacts() {
    const checkboxes = document.querySelectorAll('.existing-contact-checkbox:checked');
    if (checkboxes.length === 0) {
      showCustomError('Please select at least one existing contact to add.');
      return;
    }
  
    const manualContainer = document.getElementById('manualContactsContainer');
    if (!manualContainer) return;
    let addedCount = 0;
  
    checkboxes.forEach(cb => {
      const contactIndex = parseInt(cb.value, 10);
      const contact = window.existingContactsData[contactIndex];
      if (contact) {
        const contactPersons = manualContainer.querySelectorAll('.contact-person');
        let fieldFilled = false;
        for (let cp of contactPersons) {
          const nameInput = cp.querySelector('.contact-name');
          const postInput = cp.querySelector('.contact-post');
          const numberInput = cp.querySelector('.contact-number');
  
          if (!nameInput.value.trim() && !postInput.value.trim() && !numberInput.value.trim()) {
            nameInput.value = contact.name;
            postInput.value = contact.post;
            numberInput.value = (contact.number && contact.number !== 'N/A') ? contact.number : '';
            fieldFilled = true;
            addedCount++;
            break;
          }
        }
        if (!fieldFilled) {
          addContactPerson({
            name: contact.name,
            post: contact.post,
            number: (contact.number && contact.number !== 'N/A') ? contact.number : ''
          });
          addedCount++;
        }
      }
    });
  
    if (addedCount > 0) {
      showConfirmationMessage(`${addedCount} contact(s) added successfully.`);
    } else {
      showCustomError('No contacts were added.');
    }
    checkboxes.forEach(cb => cb.checked = false);
  }
  
  function resetContactsSection() {
    const existingContactsContainer = document.getElementById('existingContactsContainer');
    if (existingContactsContainer) existingContactsContainer.innerHTML = '';
  
    const container = document.getElementById('manualContactsContainer');
    if (container) {
      container.innerHTML = `
        <div class="contact-person" data-index="0">
          <div class="contact-header">
            <h4>Contact Person <span class="contact-letter">A</span></h4>
            <button type="button" class="remove-contact btn btn-danger" style="display: none;">×</button>
          </div>
          <div class="contact-fields">
            <div class="form-group">
              <label>Name:</label>
              <input type="text" class="contact-name" placeholder="Enter name" required aria-required="true">
            </div>
            <div class="form-group">
              <label>Post:</label>
              <input type="text" class="contact-post" placeholder="Enter designation" required aria-required="true">
            </div>
            <div class="form-group">
              <label>Contact Number:</label>
              <input type="tel" class="contact-number" placeholder="Enter contact number (optional)">
            </div>
          </div>
        </div>
      `;
    }
  }
  
  /* =========================================================
   * 5) MANUAL CONTACT PERSONS (CORE FUNCTIONS)
   * ========================================================= */
  function addContactPerson(existingData = null) {
    const container = document.getElementById('manualContactsContainer');
    if (!container) return;
    const contacts = container.getElementsByClassName('contact-person');
  
    if (contacts.length >= 26) {
      showCustomError('Maximum number of contact persons (26) reached');
      return;
    }
  
    const template = contacts[0].cloneNode(true);
    const newIndex = contacts.length;
    template.setAttribute('data-index', newIndex);
  
    const letterSpan = template.querySelector('.contact-letter');
    if (letterSpan) letterSpan.textContent = String.fromCharCode(65 + newIndex);
  
    const nameInput = template.querySelector('.contact-name');
    const postInput = template.querySelector('.contact-post');
    const numberInput = template.querySelector('.contact-number');
  
    if (existingData) {
      if (nameInput) nameInput.value = existingData.name;
      if (postInput) postInput.value = existingData.post;
      if (numberInput) numberInput.value = existingData.number;
    } else {
      if (nameInput) nameInput.value = '';
      if (postInput) postInput.value = '';
      if (numberInput) numberInput.value = '';
    }
  
    const removeBtn = template.querySelector('.remove-contact');
    if (removeBtn) removeBtn.style.display = 'block';
  
    container.appendChild(template);
    updateContactLetters();
  }
  
  function removeContactPerson(button) {
    if (!confirm('Are you sure you want to remove this contact?')) return;
    const contactPerson = button.closest('.contact-person');
    if (contactPerson) {
      contactPerson.remove();
      updateContactLetters();
    }
  }
  
  function updateContactLetters() {
    const contacts = document.querySelectorAll('.contact-person');
    contacts.forEach((contact, index) => {
      contact.setAttribute('data-index', index);
      const letterSpan = contact.querySelector('.contact-letter');
      if (letterSpan) letterSpan.textContent = String.fromCharCode(65 + index);
    });
  }
  
  function validateContactPersons() {
    const contacts = document.querySelectorAll('.contact-person');
    let isValid = true;
  
    contacts.forEach(contact => {
      const nameInput = contact.querySelector('.contact-name');
      const postInput = contact.querySelector('.contact-post');
      const numberInput = contact.querySelector('.contact-number');
  
      if (nameInput) nameInput.classList.remove('error');
      if (postInput) postInput.classList.remove('error');
      if (numberInput) numberInput.classList.remove('error');
  
      if (nameInput && !nameInput.value.trim()) {
        nameInput.classList.add('error');
        isValid = false;
      }
      if (postInput && !postInput.value.trim()) {
        postInput.classList.add('error');
        isValid = false;
      }
      if (numberInput && numberInput.value.trim() &&
          !/^\+?\d{11,13}$/.test(numberInput.value.replace(/\s+/g, ''))) {
        numberInput.classList.add('error');
        isValid = false;
      }
    });
  
    return isValid;
  }
  
  function getContactPersonsData() {
    const contacts = document.querySelectorAll('#manualContactsContainer .contact-person');
    return Array.from(contacts).map(contact => ({
      name: sanitizeInput(contact.querySelector('.contact-name').value.trim()),
      post: sanitizeInput(contact.querySelector('.contact-post').value.trim()),
      number: sanitizeInput(contact.querySelector('.contact-number').value.trim() || 'N/A')
    }));
  }
  
  /* =========================================================
   * 6) WORKLOAD MANAGEMENT
   * ========================================================= */
  function addWorkloadItem() {
    const container = document.getElementById('workloadContainer');
    if (!container) return;
    const items = container.getElementsByClassName('workload-item');
    const template = items[0].cloneNode(true);
    const newIndex = items.length;
  
    const letterSpan = template.querySelector('.workload-letter');
    if (letterSpan) letterSpan.textContent = String.fromCharCode(65 + newIndex);
  
    template.querySelectorAll('input').forEach(input => { input.value = ''; });
  
    const removeBtn = template.querySelector('.remove-workload');
    if (removeBtn) removeBtn.style.display = 'block';
  
    container.appendChild(template);
  }
  
  function removeWorkloadItem(button) {
    const workloadItem = button.closest('.workload-item');
    if (workloadItem) {
      workloadItem.remove();
      updateWorkloadIndices();
    }
  }
  
  function updateWorkloadIndices() {
    const items = document.querySelectorAll('.workload-item');
    items.forEach((item, index) => {
      const letterSpan = item.querySelector('.workload-letter');
      if (letterSpan) letterSpan.textContent = String.fromCharCode(65 + index);
    });
  }
  
  function getWorkloadData() {
    const items = document.querySelectorAll('.workload-item');
    const customer = document.getElementById('Customer') ? document.getElementById('Customer').value : '';
    return Array.from(items).map(item => ({
      addedBy: window.currentUser || '',
      customer: sanitizeInput(customer),
      competitor: sanitizeInput(item.querySelector('.workload-competitor').value),
      competitorModel: sanitizeInput(item.querySelector('.workload-model').value),
      dailyWorkload: sanitizeInput(item.querySelector('.workload-daily').value),
      perTestCost: sanitizeInput(item.querySelector('.workload-cost').value)
    }));
  }
  
  /* =========================================================
   * 7) DATE VALIDATION
   * ========================================================= */
  function validateDates() {
    const visitDateValue = document.getElementById('dateOfVisit').value;
    const nextVisitValue = document.getElementById('nextVisit').value;
    const visitDate = visitDateValue ? new Date(visitDateValue) : null;
    const nextVisit = nextVisitValue ? new Date(nextVisitValue) : null;
    
    // Normalize today's date to midnight
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    
    if (visitDate) {
      visitDate.setHours(0, 0, 0, 0);
    }
    if (nextVisit) {
      nextVisit.setHours(0, 0, 0, 0);
    }
  
    if (visitDate && visitDate > today) {
      showCustomError('Visit date cannot be in the future');
      return false;
    }
    const fourDaysAgo = new Date(today);
    fourDaysAgo.setDate(today.getDate() - 4);
    if (visitDate && visitDate < fourDaysAgo) {
      showCustomError('You cannot enter a date more than 4 days old.');
      return false;
    }
    if (nextVisit) {
      if (nextVisit < today) {
        showCustomError('Next visit date cannot be in the past');
        return false;
      }
      if (visitDate && nextVisit <= visitDate) {
        showCustomError('Next visit date must be after visit date');
        return false;
      }
    }
    return true;
  }
  
  
  /* =========================================================
   * 8) DROPDOWNS & LOADERS
   * ========================================================= */
  function populateDropdowns() {
    const independentDropdowns = ['Region', 'Product', 'Department'];
    
    independentDropdowns.forEach(function(dd) {
      showLoadingDots(`${dd.toLowerCase()}Loading`, true);
      if (dd === 'Region') {
        google.script.run
          .withSuccessHandler(function(data) {
            populateDropdown(dd, data);
            showLoadingDots(`${dd.toLowerCase()}Loading`, false);
            const regionSelect = document.getElementById('Region');
            if (regionSelect) regionSelect.addEventListener('change', filterCityByRegion);
          })
          .withFailureHandler(function(error) {
            console.error(`Failed to populate ${dd}:`, error);
            showLoadingDots(`${dd.toLowerCase()}Loading`, false);
            showCustomError(`Failed to load ${dd} data. Please try refreshing the page.`);
          })
          .getUniqueRegions();
      } else if (dd === 'Product') {
        google.script.run
          .withSuccessHandler(function(data) {
            populateDropdown(dd, data);
            showLoadingDots(`${dd.toLowerCase()}Loading`, false);
            const productSelect = document.getElementById('Product');
            if (productSelect) productSelect.addEventListener('change', filterAnalyzerByProduct);
          })
          .withFailureHandler(function(error) {
            console.error(`Failed to populate ${dd}:`, error);
            showLoadingDots(`${dd.toLowerCase()}Loading`, false);
            showCustomError(`Failed to load ${dd} data. Please try refreshing the page.`);
          })
          .getUniqueProducts();
      } else {
        google.script.run
          .withSuccessHandler(function(data) {
            populateDropdown(dd, data);
            showLoadingDots(`${dd.toLowerCase()}Loading`, false);
          })
          .withFailureHandler(function(error) {
            console.error(`Failed to populate ${dd}:`, error);
            showLoadingDots(`${dd.toLowerCase()}Loading`, false);
            showCustomError(`Failed to load ${dd} data. Please try refreshing the page.`);
          })
          .getDropdownDataCached(dd);
      }
    });
  
    const dependentDropdowns = ['City', 'Customer', 'AnalyzerModel', 'Flags'];
    dependentDropdowns.forEach(dd => {
      const select = document.getElementById(dd);
      if (select) select.disabled = true;
    });
    const categoryInput = document.getElementById('Category');
    if (categoryInput) {
      categoryInput.value = '';
      categoryInput.disabled = true;
    }
  }
  
  function populateDropdown(id, data) {
    const select = document.getElementById(id);
    if (!select) {
      console.error('Dropdown element not found:', id);
      return;
    }
    try {
      if (id === 'Category') return;
      select.innerHTML = '<option value="">Select</option>';
      if (data && Array.isArray(data) && data.length > 0) {
        data.forEach(function(row) {
          if (row && row[0]) {
            const option = document.createElement('option');
            option.value = sanitizeInput(row[0]);
            option.textContent = sanitizeInput(row[0]);
            select.appendChild(option);
          }
        });
      }
    } catch (error) {
      console.error(`Error populating dropdown ${id}:`, error);
      showCustomError(`Error loading ${id} options`);
    }
  }
  
  function filterCityByRegion() {
    const region = document.getElementById('Region').value;
    const citySelect = document.getElementById('City');
    if (region) {
      showLoadingDots('cityLoading', true);
      google.script.run
        .withSuccessHandler(function(cities) {
          populateDropdown('City', cities);
          if (citySelect) {
            citySelect.disabled = false;
            showLoadingDots('cityLoading', false);
            citySelect.addEventListener('change', filterCustomersByCity);
          }
        })
        .withFailureHandler(function(error) {
          console.error('Failed to load cities:', error);
          showLoadingDots('cityLoading', false);
          showCustomError('Failed to load cities. Please try again.');
        })
        .getCityByRegion(region);
    } else {
      clearDropdown('City');
      if (citySelect) citySelect.disabled = true;
      showLoadingDots('cityLoading', false);
    }
  }
  
  function filterCustomersByCity() {
    const city = document.getElementById('City').value;
    const customerSelect = document.getElementById('Customer');
    if (city) {
      showLoadingDots('customerLoading', true);
      google.script.run
        .withSuccessHandler(function(customers) {
          populateDropdown('Customer', customers);
          if (customerSelect) {
            customerSelect.disabled = false;
            if (customerSelect.value) {
          const changeCustomerBtn = document.getElementById('changeCustomerBtn');
          if (changeCustomerBtn) {
            changeCustomerBtn.style.display = 'inline-block';
          }
        }
            showLoadingDots('customerLoading', false);
            customerSelect.addEventListener('change', function(e) {
              resetContactsSection();
              if (e.target.value) {
                google.script.run
                  .withSuccessHandler(function(contacts) {
                    window.existingContactsData = contacts;
                    populateExistingContacts(e.target.value);
                  })
                  .getExistingContacts(e.target.value);
              }
            });
          }
        })
        .withFailureHandler(function(error) {
          console.error('Failed to load customers:', error);
          showLoadingDots('customerLoading', false);
          showCustomError('Failed to load customers. Please try again.');
        })
        .getCustomersByCity(city);
    } else {
      clearDropdown('Customer');
      if (customerSelect) customerSelect.disabled = true;
      showLoadingDots('customerLoading', false);
    }
  }
  
  function filterAnalyzerByProduct() {
    const product = document.getElementById('Product').value;
    const analyzerSelect = document.getElementById('AnalyzerModel');
    const flagsSelect = document.getElementById('Flags');
    const categoryInput = document.getElementById('Category');
  
    clearDropdown('AnalyzerModel');
    clearDropdown('Flags');
    if (categoryInput) categoryInput.value = '';
  
    if (flagsSelect) flagsSelect.disabled = true;
    if (categoryInput) categoryInput.disabled = true;
  
    if (product) {
      showLoadingDots('analyzerLoading', true);
      google.script.run
        .withSuccessHandler(function(analyzers) {
          if (analyzers.length === 0) {
            showCustomError('No Analyzer Models found for the selected Product.');
          }
          populateDropdown('AnalyzerModel', analyzers);

          }

          showLoadingDots('analyzerLoading', false);
          showCustomError('Failed to load analyzer models. Please try again.');

  function filterFlagsByAnalyzerModel() {
    const product = document.getElementById('Product').value;
    const analyzerModel = document.getElementById('AnalyzerModel').value;
    const flagsSelect = document.getElementById('Flags');
    const categoryInput = document.getElementById('Category');
  
    clearDropdown('Flags');
    if (categoryInput) categoryInput.value = '';
    if (flagsSelect) flagsSelect.disabled = true;
    if (categoryInput) categoryInput.disabled = true;
  
    if (product && analyzerModel) {
      showLoadingDots('flagsLoading', true);
      google.script.run
        .withSuccessHandler(function(flags) {
          if (flags.length === 0) {
            showCustomError('No Flags found for the selected Analyzer Model.');
          }
          populateDropdown('Flags', flags);
          if (flagsSelect) {
            flagsSelect.disabled = false;
            flagsSelect.addEventListener('change', filterCategoryByFlag);
          }
          showLoadingDots('flagsLoading', false);
        })
        .withFailureHandler(function(error) {
          console.error('Failed to load flags:', error);
          showLoadingDots('flagsLoading', false);
          showCustomError('Failed to load flags. Please try again.');
        })
        .getFlagsByProductAndAnalyzer(product, analyzerModel);
    } else {
      if (flagsSelect) flagsSelect.disabled = true;
      showLoadingDots('flagsLoading', false);
    }
  }
  
  function filterCategoryByFlag() {
    const product = document.getElementById('Product').value;
    const analyzerModel = document.getElementById('AnalyzerModel').value;
    const flag = document.getElementById('Flags').value;
    const categoryInput = document.getElementById('Category');
  
    if (!product || !analyzerModel || !flag) {
      if (categoryInput) {
        categoryInput.value = '';
        categoryInput.disabled = true;
      }
      return;
    }
  
    google.script.run
      .withSuccessHandler(function(categoryValue) {
        if (!categoryValue) {
          if (categoryInput) {
            categoryInput.value = 'No Category Found';
            categoryInput.disabled = true;
          }
          return;
        }
        if (categoryInput) {
          categoryInput.value = categoryValue;
          categoryInput.disabled = true;
        }
      })
      .withFailureHandler(function(error) {
        console.error('Failed to fetch category:', error);
        showCustomError('Failed to fetch category. Please try again.');

          categoryInput.disabled = true;

  function sanitizeInput(input) {

    return input.trim().replace(/[<>]/g, '').replace(/[&]/g, 'and').replace(/['"]/g, '').substr(0, 1000);
  }
  
  /* =========================================================
   * 9) FORM VALIDATION & SUBMISSION
   * ========================================================= */
  document.getElementById('dataForm').onsubmit = function(e) {
    e.preventDefault();
    const submitSpinner = document.getElementById('submitSpinner');
    if (submitSpinner) submitSpinner.style.display = 'inline-block';
  
    const requiredFields = [
      'dateOfVisit','visitType','Region','City','Customer',
      'Department','Product','AnalyzerModel','Flags','VISIT_DESCRIPTION'
    ];
    let isValid = true;
    let firstInvalid = null;
  
    requiredFields.forEach(function(id) {
      const field = document.getElementById(id);
      if (field && !field.value) {
        field.classList.add('error-border');
        if (!firstInvalid) firstInvalid = field;
        isValid = false;
      } else if (field) {
        field.classList.remove('error-border');
      }
    });
  
    if (!validateDates()) isValid = false;
    if (!validateContactPersons()) {
      isValid = false;
      showCustomError('Please fill in all required contact person fields correctly.');
    }
  
    if (!isValid) {
      if (submitSpinner) submitSpinner.style.display = 'none';
      if (firstInvalid) firstInvalid.focus();
      return;
    }
  
    const imageFile = document.getElementById('imageUpload').files[0];
  
    const finalizeSubmission = function(imageDataUrl) {
      const manualContacts = getContactPersonsData();
      const selectedCheckboxes = document.querySelectorAll('.existing-contact-checkbox:checked');
      const selectedExistingContacts = Array.from(selectedCheckboxes).map(cb => {
        const index = cb.value;
        const contact = window.existingContactsData[index];
        return {
          name: sanitizeInput(contact.name),
          post: sanitizeInput(contact.post),
          number: sanitizeInput(contact.number !== 'N/A' ? contact.number : '')
        };
      });
      const allContacts = [...selectedExistingContacts, ...manualContacts];
      const categoryInput = document.getElementById('Category');
      const categoryValue = (categoryInput && categoryInput.value)
                            ? sanitizeInput(categoryInput.value)
                            : "";
  
      const formObject = {
        dateOfVisit: sanitizeInput(document.getElementById('dateOfVisit').value),
        visitType: sanitizeInput(document.getElementById('visitType').value),
        Region: sanitizeInput(document.getElementById('Region').value),
        City: sanitizeInput(document.getElementById('City').value),
        Customer: sanitizeInput(document.getElementById('Customer').value),
        newCustomer: sanitizeInput(document.getElementById('newCustomer').value),
        Department: sanitizeInput(document.getElementById('Department').value),
        SalesPerson: sanitizeInput(window.currentUser),
        Product: sanitizeInput(document.getElementById('Product').value),
        AnalyzerModel: sanitizeInput(document.getElementById('AnalyzerModel').value),
        Flags: sanitizeInput(document.getElementById('Flags').value),
        Category: categoryValue,
        VISIT_DESCRIPTION: sanitizeInput(document.getElementById('VISIT_DESCRIPTION').value),
        IMAGE: imageDataUrl || "",
        contactPersons: allContacts,
        nextVisit: sanitizeInput(document.getElementById('nextVisit').value) || "",
        workloads: getWorkloadData(),
        submissionTimeStamp: getCurrentPKTTimeStamp()
      };
  
      console.log('Form Object:', formObject);
  
      google.script.run
        .withSuccessHandler(function(response) {
          if (submitSpinner) submitSpinner.style.display = 'none';
          showConfirmationMessage(response);
          showCustomModal();
        })
        .withFailureHandler(function(error) {
          console.error('Error submitting form:', error);
          if (submitSpinner) submitSpinner.style.display = 'none';
          showCustomError('Failed to submit the form. Please try again.');
        })
        .processForm(formObject, window.currentUser, window.sessionToken);
    };
  
    if (imageFile) {
      const reader = new FileReader();
      reader.onload = function(e) {
        finalizeSubmission(e.target.result);
      };
      reader.readAsDataURL(imageFile);
    } else {
      finalizeSubmission("");
    }
  };

  function previewImage() {
    const fileInput = document.getElementById('imageUpload');
    const previewTag = document.getElementById('previewImageTag');
    const previewDiv = document.getElementById('imagePreview');
    const file = fileInput.files[0];
    if (file) {
      if (file.size > 5 * 1024 * 1024) {
        showCustomError('Image size should not exceed 5MB');
        removeImage();
        return;
      }
      if (!file.type.startsWith('image/')) {
        showCustomError('Please upload only image files');
        removeImage();
        return;
      }
      const reader = new FileReader();
      reader.onload = function(e) {
        if (previewTag) previewTag.src = e.target.result;
        if (previewDiv) previewDiv.style.display = 'block';
      };
      reader.readAsDataURL(file);
    }
  }
  
  function removeImage() {
    const fileInput = document.getElementById('imageUpload');
    const previewTag = document.getElementById('previewImageTag');
    const previewDiv = document.getElementById('imagePreview');
    if (fileInput) fileInput.value = '';

  window.onload = function() {
    updateTimestamp();
    setInterval(updateTimestamp, 1000);
  
    const dateOfVisit = document.getElementById('dateOfVisit');
    if (dateOfVisit) {
      const today = new Date();
      const fourDaysAgo = new Date();
      fourDaysAgo.setDate(today.getDate() - 4);
      dateOfVisit.max = formatDate(today);
      dateOfVisit.min = formatDate(fourDaysAgo);
    }
  
    const nextVisit = document.getElementById('nextVisit');
    if (nextVisit) {
      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      nextVisit.min = formatDate(tomorrow);
    }
  
    const categoryInput = document.getElementById('Category');
    if (categoryInput) categoryInput.disabled = true;
  };
  
  function updateTimestamp() {
    const now = new Date();
    const formatted = now.toLocaleString('en-US', {
      weekday: 'long', year: 'numeric', month: 'long',
      day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit'
    });
    const timestamp = document.getElementById('timestamp');
    if (timestamp) timestamp.textContent = 'Current Date & Time: ' + formatted;
  }
  
  function formatDate(date) {
    return date.toISOString().split('T')[0];
  }
  
  function getCurrentPKTTimeStamp() {
    return new Date().toLocaleString('en-US', { timeZone: 'Asia/Karachi', hour12: false });
  }

  /**
   * Converts raw array rows into an array of objects with named properties.
   * Adjust the indices to match the order your server returns.
   */
  function convertRowsToObjects(rows) {
    // Example mapping: [1: date, 7: salesPerson, 2: callType, 3: region, 4: city,
    // 5: customer, 6: department, 8: product, 12: details, 17: uploaded]
    return rows.map(function(row) {
      return {
        date:         row[1] || '',
        salesPerson:  row[7] || '',
        callType:     row[2] || '',
        region:       row[3] || '',
        city:         row[4] || '',
        customer:     row[5] || '',
        department:   row[6] || '',
        product:      row[8] || '',
        details:      row[12] || '',
        uploaded:     row[17] || ''
      };
    });
  }
  
  /**
   * Populates both inline and modal tables with row data (as objects).
   */
  function displayReportData(data) {
    const reportTableBody = document.getElementById('reportTableBody');
    const modalTableBody  = document.getElementById('modalTableBody');
  
   if (!reportTableBody || !modalTableBody) {
      console.error("One or both table body elements are missing from the DOM.");
      alert("Missing table body elements: " +
            "reportTableBody: " + !!reportTableBody +
            ", modalTableBody: " + !!modalTableBody);
      return;
    }
  document.querySelectorAll('.resize-handle').forEach(handle => {
    handle.addEventListener('mousedown', initResize);
  });
  
    const tableHTML = data.map(row => `
      <tr>
        <td>${row.salesPerson}</td>
        <td>${row.date}</td>
        <td>${row.callType}</td>
        <td>${row.region}</td>
        <td>${row.city}</td>
        <td>${row.customer}</td>
        <td>${row.department}</td>
        <td>${row.product}</td>
        <td>${row.details}</td>
        <td>${row.uploaded}</td>
      </tr>
    `).join('');
  
    reportTableBody.innerHTML = tableHTML;
    modalTableBody.innerHTML  = tableHTML;
  }

  document.querySelectorAll('.resize-handle').forEach(handle => {
    handle.addEventListener('mousedown', initResize);
  });
  
  function initResize(e) {
    e.preventDefault();
    const th = e.target.parentElement;
    const startX = e.pageX;
    const startWidth = th.offsetWidth;
    
    function doDrag(e) {
      const newWidth = startWidth + (e.pageX - startX);
      th.style.width = newWidth + 'px';
    }
    
    function stopDrag() {
      document.documentElement.removeEventListener('mousemove', doDrag, false);
      document.documentElement.removeEventListener('mouseup', stopDrag, false);
    }
    
    document.documentElement.addEventListener('mousemove', doDrag, false);
    document.documentElement.addEventListener('mouseup', stopDrag, false);
  }
