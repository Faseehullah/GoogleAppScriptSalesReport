<script>
  /* =====================================
     Global Variables -- Script.html
     ===================================== */
  let userAvatarUrl = null;         // Stores the user's avatar URL after login
  window.currentUser = null;        // Stores the current user's username
  window.sessionToken = null;       // Stores the session token
  window.existingContactsData = []; // Stores existing contacts (from server)
  
  /* =====================================
     Event Listeners Binding on DOM Content Loaded
     ===================================== */
  document.addEventListener('DOMContentLoaded', function() {

    /***********************************************
     * NEW CUSTOMER ADDITION (BUTTON & FORM)
     ***********************************************/
    const addCustomerBtn = document.getElementById('addCustomerButton');
    if (addCustomerBtn) {
      addCustomerBtn.addEventListener('click', toggleAddCustomerForm);
    }

    const saveCustomerBtn = document.getElementById('saveNewCustomerButton');
    if (saveCustomerBtn) {
      saveCustomerBtn.addEventListener('click', submitAddCustomerForm);
    }

    /***********************************************
     * MANUAL CONTACTS (BUTTON TO ADD MORE)
     ***********************************************/
    const addContactPersonBtn = document.getElementById('addContactPersonBtn');
    if (addContactPersonBtn) {
      addContactPersonBtn.addEventListener('click', function() {
        addContactPerson(); // Add a new manual contact person
      });
    }

    // Event delegation for removing manual contacts
    const manualContactsContainer = document.getElementById('manualContactsContainer');
    if (manualContactsContainer) {
      manualContactsContainer.addEventListener('click', function(event) {
        if (event.target && event.target.classList.contains('remove-contact')) {
          removeContactPerson(event.target);
        }
      });
    }

    /***********************************************
     * WORKLOAD LAYOUT
     ***********************************************/
    const addWorkloadBtn = document.getElementById('addWorkloadBtn');
    if (addWorkloadBtn) {
      addWorkloadBtn.addEventListener('click', addWorkloadItem);
    }

    const workloadContainer = document.getElementById('workloadContainer');
    if (workloadContainer) {
      workloadContainer.addEventListener('click', function(e) {
        if (e.target && e.target.classList.contains('remove-workload')) {
          removeWorkloadItem(e.target);
        }
      });
    }

    /***********************************************
     * BUTTONS & MODALS (ADD MORE, CLOSE ERROR, ETC.)
     ***********************************************/
    const yesAddMoreBtn = document.getElementById('yesAddMoreBtn');
    const noAddMoreBtn = document.getElementById('noAddMoreBtn');
    if (yesAddMoreBtn) {
      yesAddMoreBtn.addEventListener('click', function() {
        handleModalResponse(true);
      });
    }
    if (noAddMoreBtn) {
      noAddMoreBtn.addEventListener('click', function() {
        handleModalResponse(false);
      });
    }

    const closeErrorModalBtn = document.getElementById('closeErrorModalBtn');
    if (closeErrorModalBtn) {
      closeErrorModalBtn.addEventListener('click', closeErrorModal);
    }

    /***********************************************
     * LOGIN & FORGOT PASSWORD
     ***********************************************/
    const loginBtn = document.getElementById('loginButton');
    if (loginBtn) {
      loginBtn.addEventListener('click', login);
    }

    const forgotLink = document.getElementById('forgotPasswordLink');
    const forgotPasswordModal = document.getElementById('forgotPasswordModal');
    const resetButton = document.getElementById('resetPasswordButton');
    const cancelButton = document.getElementById('cancelResetButton');

    if (forgotLink) {
      forgotLink.addEventListener('click', function(e) {
        e.preventDefault();
        forgotPasswordModal.style.display = 'block';
      });
    }
    if (resetButton) {
      resetButton.addEventListener('click', function() {
        const userInput = document.getElementById('resetEmailOrUsername').value.trim();
        if (!userInput) {
          showCustomError('Please enter your email or username.');
          return;
        }
        document.getElementById('resetSpinner').style.display = 'inline-block';
        google.script.run
          .withSuccessHandler(function(response) {
            document.getElementById('resetSpinner').style.display = 'none';
            if (response.success) {
              alert(response.message);
              forgotPasswordModal.style.display = 'none';
            } else {
              showCustomError(response.message);
            }
          })
          .withFailureHandler(function(error) {
            document.getElementById('resetSpinner').style.display = 'none';
            showCustomError('Error sending reset request.');
          })
          .forgotPassword(userInput);
      });
    }
    if (cancelButton) {
      cancelButton.addEventListener('click', function() {
        forgotPasswordModal.style.display = 'none';
      });
    }

    /***********************************************
     * IMAGE HANDLING (UPLOAD, PREVIEW, REMOVE)
     ***********************************************/
    const removeImageBtn = document.getElementById('removeImageButton');
    if (removeImageBtn) {
      removeImageBtn.addEventListener('click', removeImage);
    }

    const imageUploadInput = document.getElementById('imageUpload');
    if (imageUploadInput) {
      imageUploadInput.addEventListener('change', previewImage);
    }

    /***********************************************
     * EXPORT DATA (IF BUTTON EXISTS)
     ***********************************************/
    const exportBtn = document.getElementById('exportDataButton');
    if (exportBtn) {
      exportBtn.addEventListener('click', exportSalesData);
    }

    /***********************************************
     * CHANGE CUSTOMER BUTTON (IF YOU WANT TO ALLOW RE-SELECTION)
     ***********************************************/
    const changeCustomerBtn = document.getElementById('changeCustomerBtn');
    if (changeCustomerBtn) {
      changeCustomerBtn.addEventListener('click', function() {
        // Re-enable the dropdown
        const customerSelect = document.getElementById('Customer');
        if (customerSelect) {
          customerSelect.disabled = false;
        }

        // Hide the button
        changeCustomerBtn.style.display = 'none';

        // Optionally hide any label that shows the selected customer
        const selectedCustomerLabel = document.getElementById('selectedCustomerLabel');
        if (selectedCustomerLabel) {
          selectedCustomerLabel.style.display = 'none';
          selectedCustomerLabel.textContent = '';
        }

        // Reset existing contacts
        resetContactsSection();
      });
    }
  });

  /* =====================================
     LOGIN FUNCTIONALITY
     ===================================== */
  function login() {
    document.getElementById('loginSpinner').style.display = 'inline-block';

    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;

    // Basic Validation
    if (!username || !password) {
      showCustomError('Please enter both username and password.');
      document.getElementById('loginSpinner').style.display = 'none';
      return;
    }

    // Server-side checkLogin
    google.script.run
      .withSuccessHandler(function(response) {
        document.getElementById('loginSpinner').style.display = 'none';
        if (response.success) {
          // Hide login, show main form
          document.getElementById('loginForm').style.display = 'none';
          document.getElementById('mainForm').style.display = 'block';
          document.getElementById('extractionLinkAfterLogin').style.display = 'block';

          // Hide extraction link before login
          const extractionLinkBeforeLogin = document.getElementById('extractionLinkBeforeLogin');
          if (extractionLinkBeforeLogin) {
            extractionLinkBeforeLogin.style.display = 'none';
          }

          // Populate dropdowns
          populateDropdowns();

          // Show welcome container
          const welcomeContainer = document.getElementById('welcomeContainer');
          welcomeContainer.style.display = 'block';

          // Update welcome message
          const welcomeMsg = document.getElementById('welcomeMessage');
          welcomeMsg.innerHTML = `Welcome, <span style="color:#0072C6">${response.username}</span> - For Sales Report Form`;

          // If there's an avatar
          if (response.avatarUrl) {
            const avatarImg = document.getElementById('salesPersonAvatar');
            let cleanUrl = response.avatarUrl.trim();
            avatarImg.src = cleanUrl;
            avatarImg.style.display = 'inline';
          }

          // Store user info globally
          window.currentUser = response.username;
          window.sessionToken = response.token;
        } else {
          // Show invalid login error
          document.getElementById('loginError').style.display = 'block';
        }
      })
      .withFailureHandler(function(error) {
        console.error("Error during login:", error);
        document.getElementById('loginSpinner').style.display = 'none';
        showCustomError('An unexpected error occurred. Please try again.');
      })
      .checkLogin(username, password);
  }

  /* =====================================
     EXISTING CONTACTS MANAGEMENT
     ===================================== */
  function populateExistingContacts(customerId) {
    google.script.run
      .withSuccessHandler(function(contacts) {
        const existingContactsContainer = document.getElementById('existingContactsContainer');
        existingContactsContainer.innerHTML = ''; // Clear old contents

        // Disable the Customer dropdown after selection
        const customerSelect = document.getElementById('Customer');
        if (customerSelect) {
          customerSelect.disabled = true;
        }

        // Optionally show a label for the selected customer
        const selectedCustomerLabel = document.getElementById('selectedCustomerLabel');
        if (selectedCustomerLabel) {
          selectedCustomerLabel.textContent = `Selected Customer: ${customerId}`;
          selectedCustomerLabel.style.display = 'block';
        }

        // Show "Change Customer" button if needed
        const changeCustomerBtn = document.getElementById('changeCustomerBtn');
        if (changeCustomerBtn) {
          changeCustomerBtn.style.display = 'inline-block';
        }

        if (contacts.length > 0) {
          // Create heading
          const heading = document.createElement('h4');
          heading.textContent = 'Existing Contact Persons:';
          existingContactsContainer.appendChild(heading);

          // List each existing contact with a checkbox
          contacts.forEach((contact, index) => {
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.id = `existingContact_${index}`;
            checkbox.value = index;
            checkbox.classList.add('existing-contact-checkbox');

            const label = document.createElement('label');
            label.htmlFor = `existingContact_${index}`;
            label.textContent = `${contact.name} (${contact.post}) - ${contact.number}`;

            const wrapper = document.createElement('div');
            wrapper.classList.add('existing-contact');
            wrapper.appendChild(checkbox);
            wrapper.appendChild(label);

            existingContactsContainer.appendChild(wrapper);
          });

          // Add a button to add all selected existing contacts
          const addSelectedBtn = document.createElement('button');
          addSelectedBtn.type = 'button';
          addSelectedBtn.id = 'addSelectedContactsBtn';
          addSelectedBtn.classList.add('add-selected-contacts-btn');
          addSelectedBtn.textContent = 'Add Selected Contacts';
          addSelectedBtn.addEventListener('click', addSelectedContacts);
          existingContactsContainer.appendChild(addSelectedBtn);
        } else {
          // If no contacts, show a message
          const message = document.createElement('p');
          message.className = 'no-contacts-message';
          message.textContent = 'No existing contacts found. Please add contacts manually.';
          existingContactsContainer.appendChild(message);
        }
      })
      .withFailureHandler(function(error) {
        console.error('Failed to load existing contacts:', error);
        showCustomError('Failed to load existing contacts. Please try again.');
      })
      .getExistingContacts(customerId);
  }


  function addSelectedContacts() {
    const checkboxes = document.querySelectorAll('.existing-contact-checkbox:checked');
    const manualContainer = document.getElementById('contactPersonsContainer'); 
    checkboxes.forEach(checkbox => {
      const contactIndex = checkbox.value;
      const contact = window.existingContactsData[contactIndex];
      if (contact) {
        // Check for duplicates: name + post + number
        const alreadyExists = Array.from(manualContainer.querySelectorAll('.contact-person')).some(cp => {
          const existingName = cp.querySelector('.contact-name').value.trim().toUpperCase();
          const existingPost = cp.querySelector('.contact-post').value.trim().toUpperCase();
          const existingNumber = cp.querySelector('.contact-number').value.trim().toUpperCase();

          return (existingName === contact.name.toUpperCase()) &&
                 (existingPost === contact.post.toUpperCase()) &&
                 (existingNumber === (contact.number !== 'N/A' ? contact.number.toUpperCase() : ''));
        });

        if (!alreadyExists) {
          // If not a duplicate, add this contact as a new "manual" contact row
          addContactPerson({
            name: contact.name,
            post: contact.post,
            number: contact.number !== 'N/A' ? contact.number : ''
          });
        }
      }
    });
    // Optionally uncheck the checkboxes
    checkboxes.forEach(cb => cb.checked = false);
  }

  function resetContactsSection() {
    const existingContactsContainer = document.getElementById('existingContactsContainer');
    if (existingContactsContainer) {
      existingContactsContainer.innerHTML = '';
    }

    // Reset the manual container to a single blank contact
    const contactPersonsContainer = document.getElementById('contactPersonsContainer');
    contactPersonsContainer.innerHTML = `
      <div class="contact-person" data-index="0">
        <div class="contact-header">
          <h4>Contact Person <span class="contact-letter">A</span></h4>
          <button type="button" class="remove-contact" style="display: none;">×</button>
        </div>
        <div class="contact-fields">
          <div class="field-group">
            <label>Name:</label>
            <input type="text" class="contact-name" placeholder="Enter name">
          </div>
          <div class="field-group">
            <label>Post:</label>
            <input type="text" class="contact-post" placeholder="Enter designation">
          </div>
          <div class="field-group">
            <label>Contact Number:</label>
            <input type="tel" class="contact-number" placeholder="Enter contact number (optional)">
          </div>
        </div>
      </div>
    `;
  }

  /* =====================================
     MANUAL CONTACT PERSONS (CORE FUNCTIONS)
     ===================================== */
  function addContactPerson(existingData = null) {
    const container = document.getElementById('contactPersonsContainer');
    const contacts = container.getElementsByClassName('contact-person');

    // Limit to 26 letters
    if (contacts.length >= 26) {
      showCustomError('Maximum number of contact persons (26) reached');
      return;
    }

    // Clone the first contact-person as a template
    const template = contacts[0].cloneNode(true);
    const newIndex = contacts.length;

    // Update letter label
    template.setAttribute('data-index', newIndex);
    template.querySelector('.contact-letter').textContent = 
      String.fromCharCode(65 + newIndex);

    const nameInput = template.querySelector('.contact-name');
    const postInput = template.querySelector('.contact-post');
    const numberInput = template.querySelector('.contact-number');

    if (existingData) {
      // Populate from existing data
      nameInput.value = existingData.name;
      postInput.value = existingData.post;
      numberInput.value = existingData.number;
    } else {
      // Otherwise clear
      nameInput.value = '';
      postInput.value = '';
      numberInput.value = '';
    }

    template.querySelectorAll('input').forEach(inp => {
      inp.classList.remove('error');
    });

    // Show remove button
    const removeBtn = template.querySelector('.remove-contact');
    removeBtn.style.display = 'block';

    container.appendChild(template);
  }

  function removeContactPerson(button) {
    // Already corrected to confirm & remove
    if (!confirm('Are you sure you want to remove this contact?')) return;

    const contactPerson = button.closest('.contact-person');
    if (contactPerson) {
      contactPerson.remove();
      updateContactLetters();
    }
  }

  function updateContactLetters() {
    const contacts = document.querySelectorAll('.contact-person');
    contacts.forEach((contact, index) => {
      contact.setAttribute('data-index', index);
      const letter = String.fromCharCode(65 + index);
      contact.querySelector('.contact-letter').textContent = letter;
    });
  }

  function validateContactPersons() {
    const contacts = document.querySelectorAll('.contact-person');
    let isValid = true;

    contacts.forEach(contact => {
      const nameInput = contact.querySelector('.contact-name');
      const postInput = contact.querySelector('.contact-post');
      const numberInput = contact.querySelector('.contact-number');

      // Clear old errors
      nameInput.classList.remove('error');
      postInput.classList.remove('error');
      numberInput.classList.remove('error');

      // Check required fields
      if (!nameInput.value.trim()) {
        nameInput.classList.add('error');
        isValid = false;
      }
      if (!postInput.value.trim()) {
        postInput.classList.add('error');
        isValid = false;
      }

      // Phone format check if provided
      if (numberInput.value.trim() && 
          !/^\+?\d{11,13}$/.test(numberInput.value.replace(/\s+/g, ''))) {
        numberInput.classList.add('error');
        isValid = false;
      }
    });

    return isValid;
  }

  function getContactPersonsData() {
    const contacts = document.querySelectorAll('#contactPersonsContainer .contact-person');
    return Array.from(contacts).map(contact => ({
      name: sanitizeInput(contact.querySelector('.contact-name').value.trim()),
      post: sanitizeInput(contact.querySelector('.contact-post').value.trim()),
      number: sanitizeInput(contact.querySelector('.contact-number').value.trim() || 'N/A')
    }));
  }

  /* =====================================
     WORKLOAD MANAGEMENT
     ===================================== */
  function addWorkloadItem() {
    const container = document.getElementById('workloadContainer');
    const items = container.getElementsByClassName('workload-item');
    const template = items[0].cloneNode(true);
    const newIndex = items.length;

    template.querySelector('.workload-letter').textContent = String.fromCharCode(65 + newIndex);

    template.querySelectorAll('input').forEach(input => {
      input.value = '';
    });

    const removeBtn = template.querySelector('.remove-workload');
    removeBtn.style.display = 'block';

    container.appendChild(template);
  }

  function removeWorkloadItem(button) {
    const workloadItem = button.closest('.workload-item');
    if (workloadItem) {
      workloadItem.remove();
      updateWorkloadIndices();
    }
  }

  function updateWorkloadIndices() {
    const items = document.querySelectorAll('.workload-item');
    items.forEach((item, index) => {
      item.querySelector('.workload-letter').textContent = String.fromCharCode(65 + index);
    });
  }

  function getWorkloadData() {
    const items = document.querySelectorAll('.workload-item');
    return Array.from(items).map(item => ({
      competitor: sanitizeInput(item.querySelector('.workload-competitor').value),
      competitorModel: sanitizeInput(item.querySelector('.workload-model').value),
      dailyWorkload: sanitizeInput(item.querySelector('.workload-daily').value),
      perTestCost: sanitizeInput(item.querySelector('.workload-cost').value)
    }));
  }

  /* =====================================
     DATE VALIDATION
     ===================================== */
  function validateDates() {
    const visitDateValue = document.getElementById('dateOfVisit').value;
    const nextVisitValue = document.getElementById('nextVisit').value;

    const visitDate = visitDateValue ? new Date(visitDateValue) : null;
    const nextVisit = nextVisitValue ? new Date(nextVisitValue) : null;
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    if (visitDate && visitDate > today) {
      showCustomError('Visit date cannot be in the future');
      return false;
    }
    if (nextVisit) {
      if (nextVisit < today) {
        showCustomError('Next visit date cannot be in the past');
        return false;
      }
      if (visitDate && nextVisit <= visitDate) {
        showCustomError('Next visit date must be after visit date');
        return false;
      }
    }
    return true;
  }

  /* =====================================
     DROPDOWNS & LOADERS
     ===================================== */
  function populateDropdowns() {
    // We'll fetch the following dropdowns
    const dropdowns = ['Region', 'City', 'Customer', 'Product', 'Department', 'Flags', 'AnalyzerModel'];
    
    dropdowns.forEach(function(dd) {
      showLoadingDots(`${dd.toLowerCase()}Loading`, true);
      google.script.run
        .withSuccessHandler(function(data) {
          populateDropdown(dd, data);
          showLoadingDots(`${dd.toLowerCase()}Loading`, false);

          // If it's the AnalyzerModel, disable it until product is chosen
          if (dd === 'AnalyzerModel') {
            document.getElementById(dd).disabled = true;
          }

          // If "Customer" changes -> fetch existing contacts
          if (dd === 'Customer') {
            const customerSelect = document.getElementById('Customer');
            customerSelect.addEventListener('change', function(e) {
              resetContactsSection();

              if (e.target.value) {
                google.script.run
                  .withSuccessHandler(function(contacts) {
                    window.existingContactsData = contacts;
                    populateExistingContacts(e.target.value);
                  })
                  .getExistingContacts(e.target.value);
              }
            });
          }

          // Region -> City
          if (dd === 'Region') {
            document.getElementById('Region').addEventListener('change', filterCityByRegion);
          }

          // City -> Customer
          if (dd === 'City') {
            document.getElementById('City').addEventListener('change', filterCustomersByCity);
          }

          // Product -> AnalyzerModel
          if (dd === 'Product') {
            document.getElementById('Product').addEventListener('change', filterAnalyzerByProduct);
          }

          // If Flags -> Category
          if (dd === 'Flags') {
            const flagsSelect = document.getElementById('Flags');
            flagsSelect.addEventListener('change', filterCategoryByFlag);
          }
        })
        .withFailureHandler(function(error) {
          console.error(`Failed to populate ${dd}:`, error);
          showLoadingDots(`${dd.toLowerCase()}Loading`, false);
          showCustomError(`Failed to load ${dd} data. Please try refreshing the page.`);
        })
        .getDropdownDataCached(dd);
    });
  }

  function populateDropdown(id, data) {
    const select = document.getElementById(id);
    if (!select) {
      console.error('Dropdown element not found:', id);
      return;
    }
    try {
      select.innerHTML = '<option value="">Select</option>';
      if (data && Array.isArray(data) && data.length > 0) {
        data.forEach(function(row) {
          if (row && row[0]) {
            const option = document.createElement('option');
            option.value = sanitizeInput(row[0]);
            option.textContent = sanitizeInput(row[0]);
            select.appendChild(option);
          }
        });
      }
    } catch (error) {
      console.error(`Error populating dropdown ${id}:`, error);
      showCustomError(`Error loading ${id} options`);
    }
  }

  function filterCityByRegion() {
    const region = document.getElementById('Region').value;
    const citySelect = document.getElementById('City');
    if (region) {
      showLoadingDots('cityLoading', true);
      google.script.run
        .withSuccessHandler(function(cities) {
          populateDropdown('City', cities);
          citySelect.disabled = false;
          clearDropdown('Customer');
          showLoadingDots('cityLoading', false);
        })
        .withFailureHandler(function(error) {
          console.error('Failed to load cities:', error);
          showLoadingDots('cityLoading', false);
          showCustomError('Failed to load cities. Please try again.');
        })
        .getCityByRegion(region);
    } else {
      clearDropdown('City');
      clearDropdown('Customer');
      showLoadingDots('cityLoading', false);
    }
  }

  function filterCustomersByCity() {
    const city = document.getElementById('City').value;
    const customerSelect = document.getElementById('Customer');
    if (city) {
      showLoadingDots('customerLoading', true);
      google.script.run
        .withSuccessHandler(function(customers) {
          populateDropdown('Customer', customers);
          customerSelect.disabled = false;
          showLoadingDots('customerLoading', false);
        })
        .withFailureHandler(function(error) {
          console.error('Failed to load customers:', error);
          showLoadingDots('customerLoading', false);
          showCustomError('Failed to load customers. Please try again.');
        })
        .getCustomersByCity(city);
    } else {
      clearDropdown('Customer');
      customerSelect.disabled = true;
      showLoadingDots('customerLoading', false);
    }
  }

  function filterAnalyzerByProduct() {
    const product = document.getElementById('Product').value;
    const analyzerSelect = document.getElementById('AnalyzerModel');
    if (product) {
      showLoadingDots('analyzerLoading', true);
      google.script.run
        .withSuccessHandler(function(analyzers) {
          populateDropdown('AnalyzerModel', analyzers);
          analyzerSelect.disabled = false;
          showLoadingDots('analyzerLoading', false);
        })
        .withFailureHandler(function(error) {
          console.error('Failed to load analyzers:', error);
          showLoadingDots('analyzerLoading', false);
          showCustomError('Failed to load analyzer models. Please try again.');
        })
        .getAnalyzersByProduct(product);
    } else {
      clearDropdown('AnalyzerModel');
      analyzerSelect.disabled = true;
      showLoadingDots('analyzerLoading', false);
    }
  }

  /**
   * Called when the "Flags" dropdown changes.
   * Fetches the matching Category from the server and updates the Category dropdown.
   */
  function filterCategoryByFlag() {
    const product = document.getElementById('Product').value;
    const flag = document.getElementById('Flags').value;
    const categorySelect = document.getElementById('Category');

    // If product or flag is missing, clear Category
    if (!product || !flag) {
      categorySelect.innerHTML = '<option value="">Select</option>';
      categorySelect.disabled = true;
      return;
    }

    // Make a server call to get the Category
    google.script.run
      .withSuccessHandler(function(categoryValue) {
        // If no category found, we set the dropdown to empty
        if (!categoryValue) {
          categorySelect.innerHTML = '<option value="">No Category Found</option>';
          categorySelect.disabled = true;
          return;
        }

        // Otherwise, populate a single option
        categorySelect.disabled = false;
        categorySelect.innerHTML = '';
        const option = document.createElement('option');
        option.value = categoryValue;
        option.textContent = categoryValue;
        categorySelect.appendChild(option);
      })
      .withFailureHandler(function(error) {
        console.error('Failed to fetch category:', error);
        showCustomError('Failed to fetch category. Please try again.');
        categorySelect.innerHTML = '<option value="">Error</option>';
        categorySelect.disabled = true;
      })
      .getCategoryByFlag(product, flag); 
  }

  function clearDropdown(id) {
    const select = document.getElementById(id);
    if (select) {
      select.innerHTML = '<option value="">Select</option>';
      select.disabled = true;
    }
  }

  function showLoadingDots(id, show) {
    const element = document.getElementById(id);
    if (element) {
      element.style.display = show ? 'inline-block' : 'none';
    }
  }

  function sanitizeInput(input) {
    if (typeof input !== 'string') return input;
    return input.trim().replace(/[<>]/g, '').replace(/[&]/g, 'and').replace(/['"]/g, '').substr(0, 1000);
  }

  /* =====================================
     FORM VALIDATION & SUBMISSION
     ===================================== */
  document.getElementById('dataForm').onsubmit = function(e) {
    e.preventDefault();
    document.getElementById('submitSpinner').style.display = 'inline-block';

    // Required fields
    const requiredFields = [
      'dateOfVisit','visitType','Region','City','Customer',
      'Department','Product','AnalyzerModel','Flags','VISIT_DESCRIPTION'
    ];
    let isValid = true;
    let firstInvalid = null;

    requiredFields.forEach(function(id) {
      const field = document.getElementById(id);
      if (field && !field.value) {
        field.style.border = "4px solid red";
        if (!firstInvalid) firstInvalid = field;
        isValid = false;
      } else if (field) {
        field.style.border = "";
      }
    });

    // Validate date constraints
    if (!validateDates()) {
      isValid = false;
    }

    // Validate contact persons
    if (!validateContactPersons()) {
      isValid = false;
      showCustomError('Please fill in all required contact person fields correctly');
    }

    if (!isValid) {
      document.getElementById('submitSpinner').style.display = 'none';
      if (firstInvalid) firstInvalid.focus();
      return;
    }

    // Handle image file if any
    const imageFile = document.getElementById('imageUpload').files[0];

    const finalizeSubmission = function(imageDataUrl) {
      // Gather manual contacts
      const manualContacts = getContactPersonsData();

      // Gather selected existing contacts
      const selectedCheckboxes = document.querySelectorAll('.existing-contact-checkbox:checked');
      const selectedExistingContacts = Array.from(selectedCheckboxes).map(cb => {
        const index = cb.value;
        const contact = window.existingContactsData[index];
        return {
          name: sanitizeInput(contact.name),
          post: sanitizeInput(contact.post),
          number: sanitizeInput(contact.number !== 'N/A' ? contact.number : '')
        };
      });

      // Combine them, skipping duplicates
      const allContacts = [...selectedExistingContacts, ...manualContacts];

      // Now also fetch the Category 
      const categorySelect = document.getElementById('Category');
      const categoryValue = categorySelect && categorySelect.value 
                            ? sanitizeInput(categorySelect.value) 
                            : "";

      // Build form object
      const formObject = {
        dateOfVisit: sanitizeInput(document.getElementById('dateOfVisit').value),
        visitType: sanitizeInput(document.getElementById('visitType').value),
        Region: sanitizeInput(document.getElementById('Region').value),
        City: sanitizeInput(document.getElementById('City').value),
        Customer: sanitizeInput(document.getElementById('Customer').value),
        newCustomer: sanitizeInput(document.getElementById('newCustomer').value),
        Department: sanitizeInput(document.getElementById('Department').value),
        SalesPerson: sanitizeInput(window.currentUser),
        Product: sanitizeInput(document.getElementById('Product').value),
        AnalyzerModel: sanitizeInput(document.getElementById('AnalyzerModel').value),
        Flags: sanitizeInput(document.getElementById('Flags').value),
        Category: categoryValue,
        VISIT_DESCRIPTION: sanitizeInput(document.getElementById('VISIT_DESCRIPTION').value),
        IMAGE: imageDataUrl || "",
        contactPersons: allContacts,
        nextVisit: sanitizeInput(document.getElementById('nextVisit').value) || "",
        workloads: getWorkloadData()
      };

      google.script.run
        .withSuccessHandler(function(response) {
          document.getElementById('submitSpinner').style.display = 'none';
          showConfirmationMessage(response);
          showCustomModal();
        })
        .withFailureHandler(function(error) {
          console.error('Error submitting form:', error);
          document.getElementById('submitSpinner').style.display = 'none';
          showCustomError('Failed to submit the form. Please try again.');
        })
        .processForm(formObject, window.currentUser, window.sessionToken);
    };

    if (imageFile) {
      const reader = new FileReader();
      reader.onload = function(e) {
        finalizeSubmission(e.target.result);
      };
      reader.readAsDataURL(imageFile);
    } else {
      finalizeSubmission("");
    }
  };

  /**
   * Resets the form to a fresh state
   */
  function resetForm() {
    document.getElementById('dataForm').reset();
    document.getElementById('newCustomerField').style.display = 'none';

    // Reset manual container to one blank contact
    const manualContainer = document.getElementById('manualContactsContainer');
    const contacts = manualContainer.querySelectorAll('.contact-person');
    while (contacts.length > 1) {
      contacts[contacts.length - 1].remove();
    }
    contacts[0].querySelectorAll('input').forEach(input => {
      input.value = '';
      input.classList.remove('error');
    });
    removeImage();

    // Clear existing contacts
    resetContactsSection();

    // Re-enable the Customer dropdown if desired
    const customerSelect = document.getElementById('Customer');
    if (customerSelect) {
      customerSelect.disabled = false;
    }

    // Hide selectedCustomerLabel & changeCustomerBtn if used
    const selectedCustomerLabel = document.getElementById('selectedCustomerLabel');
    if (selectedCustomerLabel) {
      selectedCustomerLabel.style.display = 'none';
      selectedCustomerLabel.textContent = '';
    }
    const changeCustomerBtn = document.getElementById('changeCustomerBtn');
    if (changeCustomerBtn) {
      changeCustomerBtn.style.display = 'none';
    }
  }

  /* =====================================
     MODALS & CONFIRMATIONS
     ===================================== */
  function showCustomError(msg) {
    document.getElementById('errorMessage').textContent = msg;
    document.getElementById('errorModal').style.display = 'flex';
  }

  function closeErrorModal() {
    document.getElementById('errorModal').style.display = 'none';
  }

  function showConfirmationMessage(msg) {
    const cm = document.getElementById('confirmationMessage');
    cm.textContent = msg;
    cm.classList.add('show');
    setTimeout(function() {
      cm.classList.add('hide');
      setTimeout(function(){
        cm.classList.remove('show','hide');
      }, 500);
    }, 3000);
  }

  function showCustomModal() {
    const cModal = document.getElementById('customModal');
    if (cModal) cModal.style.display = 'flex';
  }

  function handleModalResponse(addMore) {
    if (addMore) {
      resetForm();
      document.getElementById('newCustomerField').style.display = 'none';
      document.querySelectorAll('.error').forEach(element => element.classList.remove('error'));
      document.querySelectorAll('[style*="border"]').forEach(element => {
        element.style.border = '';
      });
    } else {
      window.location.reload();
    }
    document.getElementById('customModal').style.display = 'none';
  }

  /* =====================================
     IMAGE HANDLING
     ===================================== */
  function previewImage() {
    const fileInput = document.getElementById('imageUpload');
    const previewTag = document.getElementById('previewImageTag');
    const previewDiv = document.getElementById('imagePreview');
    const file = fileInput.files[0];

    if (file) {
      if (file.size > 5 * 1024 * 1024) {
        showCustomError('Image size should not exceed 5MB');
        removeImage();
        return;
      }
      if (!file.type.startsWith('image/')) {
        showCustomError('Please upload only image files');
        removeImage();
        return;
      }
      const reader = new FileReader();
      reader.onload = function(e) {
        previewTag.src = e.target.result;
        previewDiv.style.display = 'block';
      };
      reader.readAsDataURL(file);
    }
  }

  function removeImage() {
    const fileInput = document.getElementById('imageUpload');
    const previewTag = document.getElementById('previewImageTag');
    const previewDiv = document.getElementById('imagePreview');
    fileInput.value = '';
    previewTag.src = '';
    previewDiv.style.display = 'none';
  }

  /* =====================================
     TOGGLE ADD NEW CUSTOMER FORM
     ===================================== */
  function toggleAddCustomerForm() {
    const form = document.getElementById('addCustomerManualForm');
    if (form) {
      form.style.display = (form.style.display === 'none' || form.style.display === '') ? 'block' : 'none';
      if (form.style.display === 'block') {
        document.getElementById('addCustRegionSelect').focus();
      }
    }
  }

  /* =====================================
     SUBMIT ADD NEW CUSTOMER FORM
     ===================================== */
  function submitAddCustomerForm() {
    const region = document.getElementById('addCustRegionSelect').value;
    const city = document.getElementById('addCustCityInput').value.trim();
    const customerName = document.getElementById('addCustNameInput').value.trim();

    if (!region) {
      showCustomError('Please select a region.');
      return;
    }
    if (!city) {
      showCustomError('Please enter a city.');
      return;
    }
    if (!customerName) {
      showCustomError('Please enter a customer name.');
      return;
    }

    const newCustomerData = {
      region: sanitizeInput(region),
      city: sanitizeInput(city),
      customerName: sanitizeInput(customerName)
    };

    const saveButton = document.getElementById('saveNewCustomerButton');
    if (saveButton) {
      saveButton.disabled = true;
      saveButton.textContent = 'Saving...';
    }

    google.script.run
      .withSuccessHandler(function(response) {
        showConfirmationMessage(response);
        resetAddCustomerForm();
        populateDropdowns();
        if (saveButton) {
          saveButton.disabled = false;
          saveButton.textContent = 'Save New Customer';
        }
      })
      .withFailureHandler(function(error) {
        console.error('Error adding new customer:', error);
        showCustomError('Failed to add new customer. Please try again.');
        if (saveButton) {
          saveButton.disabled = false;
          saveButton.textContent = 'Save New Customer';
        }
      })
      .addNewCustomerWithCity(newCustomerData.region, newCustomerData.city, newCustomerData.customerName, window.currentUser, window.sessionToken);
  }

  function resetAddCustomerForm() {
    const form = document.getElementById('addCustomerManualForm');
    if (form) {
      form.reset();
      form.style.display = 'none';
    }
  }

  /* =====================================
     INITIALIZATION ON PAGE LOAD
     ===================================== */
  window.onload = function() {
    updateTimestamp();
    setInterval(updateTimestamp, 1000);

    const dateOfVisit = document.getElementById('dateOfVisit');
    const today = new Date();
    const thirtyDaysAgo = new Date();
    thirtyDaysAgo.setDate(today.getDate() - 30);
    dateOfVisit.max = formatDate(today);
    dateOfVisit.min = formatDate(thirtyDaysAgo);

    const nextVisit = document.getElementById('nextVisit');
    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    nextVisit.min = formatDate(tomorrow);
  };

  function updateTimestamp() {
    const now = new Date();
    const formatted = now.toLocaleString('en-US', {
      weekday: 'long', year: 'numeric', month: 'long',
      day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit'
    });
    document.getElementById('timestamp').textContent = 'Current Date & Time: ' + formatted;
  }

  function formatDate(date) {
    return date.toISOString().split('T')[0];
  }

  /* =====================================
     EXPORT FUNCTIONS (CSV)
     ===================================== */
  function exportSalesData() {
    if (!window.currentUser || !window.sessionToken) {
      showCustomError('You must be logged in to export data.');
      return;
    }

    if (!confirm('Are you sure you want to export your sales data?')) {
      return;
    }
    const exportBtn = document.getElementById('exportDataButton');
    exportBtn.disabled = true;
    exportBtn.textContent = 'Exporting...';

    google.script.run
      .withSuccessHandler(function(downloadUrl) {
        if (downloadUrl) {
          window.open(downloadUrl, '_blank');
          showConfirmationMessage('Your sales data has been exported successfully.');
        } else {
          showCustomError('No data available for export.');
        }
        exportBtn.disabled = false;
        exportBtn.textContent = 'Export My Sales Data';
      })
      .withFailureHandler(function(error) {
        console.error("Export Error:", error);
        showCustomError('Failed to export data. Please try again.');
        exportBtn.disabled = false;
        exportBtn.textContent = 'Export My Sales Data';
      })
      .exportSalesPersonDataAsCSV(window.currentUser, window.sessionToken);
  }
</script>
